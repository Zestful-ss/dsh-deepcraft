name: Release

# A release starts from a tag the maintainer pushes: the version's CHANGELOG
# section and the bumped package.json are already in that commit. The job runs
# the gates the fast tier holds, then the end-to-end lane, and only then writes
# the packed package to the `dist` branch so a git install needs no build (D47),
# and opens the GitHub Release with the version's CHANGELOG section. The
# promotion is the last step: the gates above it are the ones CI's own jobs run
# (D66). The `dist` branch is this repository's only distribution channel; the
# package is not published to npm.

on:
  push:
    tags: ['v*']

# contents: the dist branch, the moved tag and the GitHub Release (D47).
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The readers' desktop runs on Windows, and the release carries the same
  # package to it: the smoke there is a gate the promotion waits on, as it is in
  # CI.
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke

  release:
    needs: smoke-windows
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check the tag names the package version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error title=Release::tag ${GITHUB_REF_NAME} does not name package.json's version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run changelog:check
      - run: npm run agents:check
      - run: npm run checks:numbers -- --check
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      # The assembled host on the newest published version, walked over the scenario
      # table's own default walk: what a pull request runs is what the promotion
      # waits on (D66).
      - run: npm install --global pnpm@11 @deepseek-ai/dsh@$(node packages/testing/host-version.cjs)
      - run: node packages/testing/e2e.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-e2e-traces
          path: .debug/e2e/out
          if-no-files-found: ignore
      # The dist branch carries the package's own contents, and the step builds
      # first: `lib/` is not in version control, so a fresh checkout has none and
      # packing alone would ship a `main` that is not in the package. A rerun of
      # the same tag writes the same files again and moves the tag with them.
      - name: Write the dist branch and move the tag
        run: node scripts/dist-branch.mjs --push
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .debug
          notes=.debug/release-notes.md
          node scripts/changelog.mjs --notes "${VERSION}" > "${notes}"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes-file "${notes}"
          else
            case "${VERSION}" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
            gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file "${notes}" ${prerelease}
          fi
