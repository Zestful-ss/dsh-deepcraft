name: Release

# A release starts from a tag the maintainer pushes: the version's CHANGELOG
# section and the bumped package.json are already in that commit. Three lanes
# run in parallel — the Windows smoke, the fast gates on Linux, and the
# end-to-end lane as the same four shards CI runs — and `publish` waits on all
# of them before it writes the packed package to the `dist` branch so a git
# install needs no build (D47), and opens the GitHub Release with the
# version's CHANGELOG section. The promotion is the last step: the gates above
# it are the ones CI's own jobs run (D66). The `dist` branch is this
# repository's only distribution channel; the package is not published to npm.

on:
  # A release starts from a tag the maintainer pushes (the version's CHANGELOG
  # section and the bumped package.json are already in that commit), or from a
  # manual dispatch that reads the version package.json names.
  push:
    tags: ['v*']
  workflow_dispatch:

# contents: the dist branch, the moved tag and the GitHub Release (D47).
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The readers' desktop runs on Windows, and the release carries the same
  # package to it: the smoke there is a gate the promotion waits on, as it is in
  # CI.
  smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
      # The desktop player is native: this runner is the only one where the
      # official Windows build can be owned and its pid matched (D78).
      - name: Install the newest harness
        shell: pwsh
        run: |
          $version = node packages/testing/host-version.cjs
          npm install --global "@deepseek-ai/dsh@$version" pnpm@11
      - run: node packages/testing/e2e.cjs --scenario petdex
        timeout-minutes: 15

  # The gates that need no promotion: the lint rules, the decisions index, the
  # changelog, AGENTS.md's command table, the check numbers, the build, the
  # unit lane and the Linux smoke.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run docs:check
      - run: npm run changelog:check
      - run: npm run agents:check
      - run: npm run checks:numbers -- --check
      - run: npm run build
      - run: npm test
      - run: npm run smoke

  # The assembled host on the newest published version, walked over the
  # scenario table's own default walk as the same four shards CI's e2e job
  # runs: what a pull request runs is what the promotion waits on (D66). One
  # scenario at a time inside a shard: the lane's frame readings are what a
  # second page on the same runner disturbs.
  e2e:
    strategy:
      # One shard's failure is evidence about that shard; the others finish and
      # report their own.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .debug/build-cache
          key: build-cache-${{ runner.os }}-${{ github.sha }}
      - run: npm run build
        timeout-minutes: 15
      # The lane boots the host's own CLI, which needs pnpm to install a
      # profile's plugins.
      - run: npm install --global pnpm@11 @deepseek-ai/dsh@$(node packages/testing/host-version.cjs)
        timeout-minutes: 10
      # A named scenario takes its own deadline; this is the shard's backstop.
      - run: node packages/testing/e2e.cjs --shard ${{ matrix.shard }}:4
        timeout-minutes: 25
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-e2e-traces-${{ matrix.shard }}
          path: .debug/e2e/out
          if-no-files-found: ignore

  # The promotion proper: every gate above answers first, then the dist branch
  # and the GitHub Release.
  publish:
    needs: [smoke-windows, release, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Read the version package.json names
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error title=Release::tag ${GITHUB_REF_NAME} does not name package.json's version ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      # The dist branch carries the package's own contents, and the step builds
      # first: `lib/` is not in version control, so a fresh checkout has none and
      # packing alone would ship a `main` that is not in the package. A rerun of
      # the same tag writes the same files again and moves the tag with them.
      - name: Write the dist branch and move the tag
        run: node scripts/dist-branch.mjs --push
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p .debug
          notes=.debug/release-notes.md
          node scripts/changelog.mjs --notes "${VERSION}" > "${notes}"
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release edit "v${VERSION}" --notes-file "${notes}"
          else
            case "${VERSION}" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
            gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file "${notes}" ${prerelease}
          fi
